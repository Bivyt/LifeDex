<!DOCTYPE html>
<html>
<head>
  <title>Pokémon Habitat Matcher</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <h1>Pokémon Habitat Matcher</h1>

  <form method="post">
    {% csrf_token %}
    <input name="location" placeholder="Enter a location" required>
    <button type="submit">Analyze</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
</body>
</html>
